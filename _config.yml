# Replace with your site URL. Used for the Atom self link and chapter JSON URLs.
url: https://podcast.phor.net

# Repository files, not pages. CNAME stays so GitHub Pages keeps the custom domain.
exclude:
  - CHANGELOG.md
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - yarn.lock
  - text-to-ffmetadata.js
  - scripts
  - vendor
  - node_modules
  - cache

collections:
  episodes:
    output: true
  ffmetadata:
    output: true
  chapters:
    output: true

defaults:
  - scope:
      path: ""
      type: episodes
    values:
      layout: episode
  - scope:
      path: ""
      type: ffmetadata
    values:
      layout: ffmetadata
      permalink: /ffmetadata/:path.txt
  - scope:
      path: ""
      type: chapters
    values:
      layout: chapters
      permalink: /chapters/:path.json
