# Repository files, not pages. CNAME stays so GitHub Pages keeps the custom domain.
exclude:
  - CHANGELOG.md
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - text-to-ffmetadata.js
  - vendor
  - node_modules

collections:
  episodes:
    output: true
  ffmetadata:
    output: true

defaults:
  - scope:
      path: ""
      type: episodes
    values:
      layout: episode
  - scope:
      path: ""
      type: ffmetadata
    values:
      layout: ffmetadata
      permalink: /ffmetadata/:path.txt
