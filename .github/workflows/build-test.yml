# Build and test
#
# Build the Jekyll site and check the sample feed.
#
# Ruby is the version GitHub Pages publishes at https://pages.github.com/versions.json
# The github-pages gem version is pinned in the Gemfile for the same reason.
# GitHub Pages ignores Gemfile.lock: https://github.com/github/pages-gem/issues/768

name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Lint (includes YAML)
        run: yarn lint

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Install gems
        run: bundle install

      - name: Build
        run: bundle exec jekyll build

      # The assertions describe the sample show committed in this repository.
      # Replace them when you replace _data/channel.yml and _episodes/.
      - name: Test
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = ET.parse("_site/feed.xml").getroot()
          channel = root.find("channel")
          itunes = {"itunes": "http://www.itunes.com/dtds/podcast-1.0.dtd"}
          podcast = {"podcast": "https://podcastindex.org/namespace/1.0"}
          assert channel.find("title").text == "Community Service Hour"
          assert (
              channel.find("itunes:new-feed-url", itunes).text
              == "https://hour.gg/podcast.xml"
          )
          items = channel.findall("item")
          assert len(items) == 2, len(items)
          for item in items:
              enclosure = item.find("enclosure")
              assert enclosure.get("url")
              assert int(enclosure.get("length")) > 0
              assert enclosure.get("type") == "audio/x-m4a"
              assert item.find("guid").text
              chapters = item.find("podcast:chapters", podcast)
              assert chapters is not None
              assert chapters.get("type") == "application/json+chapters"
          PY
          test -s _site/index.html
          test -s _site/ffmetadata/2023-01-03-episode-57.txt
          grep -q FFMETADATA1 _site/ffmetadata/2023-01-03-episode-57.txt
          test -s _site/chapters/2023-01-03-episode-57.json
          python3 - <<'PY'
          import json
          import pathlib

          data = json.loads(pathlib.Path("_site/chapters/2023-01-03-episode-57.json").read_text())
          intro = data["chapters"][0]
          assert intro["startTime"] == 0
          assert intro["title"] == "Intro"
          assert intro["img"] == "https://podcast.phor.net/channel.jpg"
          second = data["chapters"][1]
          assert second["startTime"] == 41
          assert second["title"] == "How to say Qumosi"
          assert "img" not in second
          PY
          printf '00:00 Intro\n01:00 Next\n' | node text-to-ffmetadata.js | grep -q FFMETADATA1
